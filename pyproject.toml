[project]
name = "online-experiment-designs-under-interference"
version = "0.1.0"
description = "Notebook-first experiments for choosing online experiment designs under interference."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Prashant Shekhar" },
  { name = "Caroline Howard" },
]
dependencies = [
  "ipykernel>=6.29",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15.0",
  "scipy>=1.12",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
